<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sales Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="{{ url_for('static', filename='dashboard.js') }}" defer></script>
</head>
<body>
    <main>
        <h1>Sales Dashboard</h1>

        <section class="card">
            <textarea id="input" placeholder="Paste your WhatsApp sales reports here..."></textarea>
            <div class="actions">
                <button id="add-report" type="button">Add Report</button>
                <button id="clear-data" type="button">Clear Data</button>
            </div>
            <p id="msg" role="status"></p>
        </section>

        <section class="card">
            <canvas id="chart"></canvas>
        </section>

        <section class="card">
            <h2>Daily Records</h2>
            <table>
                <thead>
                    <tr><th>Date</th><th>MS</th><th>HSD</th><th>Total</th></tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </section>
    </main>
</body>
</html>
